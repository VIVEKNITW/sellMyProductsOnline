spring.application.name=bakery-backend
spring.application.name=bakery-backend
# ===== DATABASE (H2) =====
spring.datasource.url=jdbc:h2:mem:bakerydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Show SQL in console (useful for learning)
spring.jpa.show-sql=true

# Automatically create tables based on Entities
spring.jpa.hibernate.ddl-auto=update

# Use H2 dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== SERVER PORT =====
# Optional: change port if needed
server.port=8080

# ===== CORS (optional, you already used @CrossOrigin) =====
# Spring default allows localhost frontend calls

# ===== Logging level (optional) =====
logging.level.org.hibernate.SQL=DEBUG
