spring.application.name=bakery-backend
# ===== DATABASE (H2) =====
spring.datasource.url=jdbc:h2:mem:bakerydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Show SQL in console (useful for learning)
spring.jpa.show-sql=true

# Automatically create tables based on Entities
spring.jpa.hibernate.ddl-auto=update

# Use H2 dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== SERVER PORT =====
# Optional: change port if needed
server.port=8080

# ===== CORS Configuration =====
# Allow frontend origin
cors.allowed-origins=*
cors.allowed-methods=GET,HEAD,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# Enable CORS logging
logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.web.filter.CorsFilter=DEBUG
cors.allow-credentials=true
cors.max-age=3600

# ===== Logging level (optional) =====
logging.level.org.hibernate.SQL=DEBUG
